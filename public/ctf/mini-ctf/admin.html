<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NUSEC Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #09090F;
      color: #DDD;
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      border: 1px solid #1E1E3A;
      padding: 3rem 2.5rem;
      width: 380px;
      text-align: center;
    }

    .logo {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: #555;
      margin-bottom: 2.5rem;
    }

    .status {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .status.denied  { color: #C8102E; }
    .status.granted { color: #00B862; }

    .sub {
      font-size: 0.7rem;
      color: #444;
    }

    .flag {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #00B862;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">NUSEC INTERNAL PORTAL</div>
  <div class="status" id="status"></div>
  <div class="sub" id="sub"></div>
  <div class="flag" id="flag"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const admin = params.get('admin');

  // Redirect to ?admin=false if no param present
  if (admin === null) {
    window.location.replace('?admin=false');
  } else if (admin === 'true') {
    document.getElementById('status').textContent = 'ACCESS GRANTED';
    document.getElementById('status').className = 'status granted';
    document.getElementById('sub').textContent = 'Welcome, administrator.';
    document.getElementById('flag').textContent = 'NUSEC{NUS3C_4DM1N_4CC3SS}';
  } else {
    document.getElementById('status').textContent = 'ACCESS DENIED';
    document.getElementById('status').className = 'status denied';
    document.getElementById('sub').textContent = 'You do not have permission to view this page.';
  }
</script>

</body>
</html>
